name: Publicar automático FitzDesk

# Domingo, martes y jueves. Objetivo: publicar dentro de la ventana 9:00-14:00 hora España.
# Programado a las 5:35 UTC (7:35 CEST / 6:35 CET) — minuto descuadrado para evitar la
# congestión del minuto en punto. Aun así, los eventos "schedule" de GitHub Actions reciben
# prioridad de cola más baja que push/workflow_dispatch, y el retraso real observado es
# variable e impredecible (de horas a 2-3 días, ver CLAUDE.md 2026-06-23). auto-publisher.js
# solo compara la fecha, no la hora, así que la publicación ocurre igual aunque se ejecute
# tarde. La ventana 9:00-14:00 es una expectativa realista, no una garantía.
on:
  schedule:
    - cron: '35 5 * * 0,2,4'
  workflow_dispatch:
    inputs:
      fecha_override:
        description: 'Simular una fecha concreta (YYYY-MM-DD). Vacío = hoy en Madrid.'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout de main con acceso completo al historial ─────────────────
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Node.js para ejecutar auto-publisher.js ───────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: fitzdesk-monitor/package-lock.json

      # ── 2b. Sincronizar el calendario desde develop ──────────────────────────
      # develop es la fuente real de verdad del calendario (ahí se edita siempre).
      # Sin este paso, main puede quedarse con una copia vieja del calendario y
      # el --check de abajo dejaría de encontrar entradas futuras en silencio
      # (bug detectado el 2026-06-23, ver CLAUDE.md). Se sobrescribe el archivo
      # local SIEMPRE antes de leerlo, y si difiere de lo que hay en main se
      # sube también, para que main no vuelva a quedarse desfasado.
      - name: Sincronizar calendario desde develop
        run: |
          git fetch origin develop
          git show origin/develop:fitzdesk-monitor/data/calendario-publicaciones.json \
            > fitzdesk-monitor/data/calendario-publicaciones.json

          if git diff --quiet -- fitzdesk-monitor/data/calendario-publicaciones.json; then
            echo "Calendario de main ya estaba al día"
          else
            git config user.name  "FitzDesk Bot"
            git config user.email "bot@fitzdesk.com"
            git add fitzdesk-monitor/data/calendario-publicaciones.json
            git commit -m "chore: sincronizar calendario de publicaciones desde develop"
            git push origin main
            echo "Calendario de main sincronizado con develop"
          fi

      # ── 3. Leer calendario y decidir qué publicar ────────────────────────────
      - name: Comprobar calendario
        id: check
        env:
          FECHA_OVERRIDE: ${{ inputs.fecha_override }}
        run: node fitzdesk-monitor/auto-publisher.js --check

      # ── 4. Traer borrador e imagen desde la rama develop ─────────────────────
      - name: Obtener borrador e imagen desde develop
        if: steps.check.outputs.status == 'ready'
        run: |
          git fetch origin develop

          DRAFT_FILE="src/content/articulos/${{ steps.check.outputs.draft_slug }}.md"
          IMAGE_FILE="public/images/articulos/${{ steps.check.outputs.image_filename }}"

          # El borrador siempre debe estar en develop
          git checkout origin/develop -- "$DRAFT_FILE"
          echo "Borrador obtenido: $DRAFT_FILE"

          # La imagen puede no existir si imageCollector no se ejecutó aún
          if git cat-file -e "origin/develop:${IMAGE_FILE}" 2>/dev/null; then
            git checkout origin/develop -- "$IMAGE_FILE"
            echo "Imagen obtenida: $IMAGE_FILE"
          else
            echo "⚠️  Imagen no encontrada en develop: $IMAGE_FILE"
            echo "    El paso --process detectará esto y enviará notificación a Discord"
          fi

      # ── 5. Editar frontmatter y renombrar el archivo ─────────────────────────
      - name: Procesar borrador
        id: process
        if: steps.check.outputs.status == 'ready'
        continue-on-error: true
        env:
          DRAFT_SLUG:     ${{ steps.check.outputs.draft_slug }}
          PUBLISHED_SLUG: ${{ steps.check.outputs.published_slug }}
        run: node fitzdesk-monitor/auto-publisher.js --process

      # ── 6. Commit y push a main (dispara deploy.yml automáticamente) ─────────
      - name: Publicar en main
        if: steps.check.outputs.status == 'ready' && steps.process.outcome == 'success'
        run: |
          git config user.name  "FitzDesk Bot"
          git config user.email "bot@fitzdesk.com"

          PUB_FILE="src/content/articulos/${{ steps.check.outputs.published_slug }}.md"
          DRF_FILE="src/content/articulos/${{ steps.check.outputs.draft_slug }}.md"
          IMG_FILE="public/images/articulos/${{ steps.check.outputs.image_filename }}"

          git add "$PUB_FILE"

          # Si se renombró el archivo, quitar el draft del índice git
          if [ "${{ steps.check.outputs.draft_slug }}" != "${{ steps.check.outputs.published_slug }}" ]; then
            git rm --cached "$DRF_FILE" 2>/dev/null || true
          fi

          [ -f "$IMG_FILE" ] && git add "$IMG_FILE"

          git commit -m "feat: publicar ${{ steps.check.outputs.titulo }}"
          git push origin main

      # ── 6b-0. Notificación Discord — artículo publicado en main ──────────────
      # Se lanza aquí, justo tras el push a main, para que llegue sin importar
      # qué ocurra después (redes sociales, deploy lento, timeouts del CDN…).
      # Valores pasados como variables de entorno para evitar problemas de
      # escapado cuando el título contiene caracteres especiales de bash.
      - name: Discord — artículo publicado en main
        if: steps.check.outputs.status == 'ready' && steps.process.outcome == 'success'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TITULO: ${{ steps.check.outputs.titulo }}
          SLUG:   ${{ steps.check.outputs.published_slug }}
          FECHA:  ${{ steps.check.outputs.fecha }}
        run: |
          jq -n \
            --arg titulo "$TITULO" \
            --arg slug   "$SLUG" \
            --arg fecha  "$FECHA" \
            --arg url    "https://fitzdesk.com/articulo/$SLUG/" \
            '{
              embeds: [{
                title:       "📰 Publicado automáticamente",
                description: ("**" + $titulo + "**\n" + $url),
                color:       5763719,
                fields: [
                  { name: "Slug",  value: $slug,  inline: true },
                  { name: "Fecha", value: $fecha, inline: true }
                ]
              }]
            }' \
          | curl -s -X POST "$DISCORD_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              --data-binary @- \
          && echo "Notificación Discord enviada" \
          || echo "⚠️ No se pudo enviar la notificación Discord"

      # ── 6b. Sincronizar develop con la versión ya publicada ──────────────────
      # Sin este paso, develop se queda para siempre con el borrador antiguo
      # (borrador: true, nombre con prefijo borrador-) aunque ya esté publicado
      # en main — invisible en local (npm run dev/build sobre develop filtra los
      # artículos con borrador: true) y desincronizado del estado real del sitio.
      - name: Sincronizar develop con el artículo publicado
        if: steps.check.outputs.status == 'ready' && steps.process.outcome == 'success'
        run: |
          PUB_FILE="src/content/articulos/${{ steps.check.outputs.published_slug }}.md"
          DRF_FILE="src/content/articulos/${{ steps.check.outputs.draft_slug }}.md"
          IMG_FILE="public/images/articulos/${{ steps.check.outputs.image_filename }}"

          # Guardar el contenido ya publicado (sin borrador: true) antes de cambiar de rama
          cp "$PUB_FILE" /tmp/published_article.md
          [ -f "$IMG_FILE" ] && cp "$IMG_FILE" /tmp/published_image || true

          git fetch origin develop
          git checkout -B develop origin/develop

          # Sustituir el borrador antiguo por la versión publicada
          if [ "${{ steps.check.outputs.draft_slug }}" != "${{ steps.check.outputs.published_slug }}" ]; then
            git rm --ignore-unmatch "$DRF_FILE"
          fi
          cp /tmp/published_article.md "$PUB_FILE"
          git add "$PUB_FILE"
          if [ -f /tmp/published_image ]; then
            cp /tmp/published_image "$IMG_FILE"
            git add "$IMG_FILE"
          fi

          if git diff --cached --quiet; then
            echo "develop ya estaba al día — nada que sincronizar"
          else
            git commit -m "chore: sincronizar ${{ steps.check.outputs.titulo }} publicado en main"
            git push origin develop
          fi

      # ── 6c. Instalar dependencias del monitor para redes sociales ────────────
      # socialPublisher.js usa dotenv y gray-matter, que no son built-ins de
      # Node. El checkout no incluye node_modules (gitignored) y este paso
      # nunca existía — el step de abajo fallaba siempre con
      # ERR_MODULE_NOT_FOUND, independientemente de los secrets (bug
      # detectado y corregido el 2026-06-23, reproducido localmente
      # simulando un checkout limpio de CI).
      - name: Instalar dependencias del monitor
        if: steps.check.outputs.status == 'ready' && steps.process.outcome == 'success' && success()
        working-directory: fitzdesk-monitor
        run: npm ci --omit=dev

      # ── 6c-idx. Reenviar sitemap a Google Search Console ─────────────────────
      # Usa sitemaps.submit (permitido para cualquier contenido) — distinto de
      # la API de Indexación, que Google restringe a JobPosting/BroadcastEvent.
      # Le dice a Google que el sitemap se actualizó; lo indexará en su próximo
      # rastreo. continue-on-error para no bloquear la publicación si falla.
      - name: Reenviar sitemap a Google Search Console
        if: steps.check.outputs.status == 'ready' && steps.process.outcome == 'success' && success()
        continue-on-error: true
        working-directory: fitzdesk-monitor
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: node indexingChecker.js --fix

      # ── 6d. Generar el carrusel de Instagram y publicarlo en producción ANTES
      #    de llamar a la API de Meta — necesita una URL pública real, y el
      #    deploy que dispara el push del paso 6 (workflow_run) no estará
      #    listo hasta que ESTE job entero termine. Por eso se dispara un
      #    segundo deploy explícito aquí y se espera a que acabe (mismo bug y
      #    mismo fix que en publicar-en-redes.yml, detectado el 2026-06-25).
      - name: Generar carrusel de Instagram
        if: steps.check.outputs.status == 'ready' && steps.process.outcome == 'success' && success()
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          SLUG="${{ steps.check.outputs.published_slug }}"
          # Si los slides ya existen en develop (pre-generados durante la revisión
          # del borrador), copiarlos directamente — sin Puppeteer ni Groq.
          SLIDES_COPIED=0
          for i in 1 2 3 4; do
            FILE="public/images/redes/${SLUG}-instagram-${i}.png"
            if git show origin/develop:"${FILE}" > "${FILE}" 2>/dev/null; then
              SLIDES_COPIED=$((SLIDES_COPIED + 1))
            fi
          done
          if [ "$SLIDES_COPIED" -gt 0 ]; then
            echo "✅ ${SLIDES_COPIED} slides pre-generados copiados desde develop — saltando Puppeteer"
          else
            echo "Sin slides pre-generados — generando con Puppeteer"
            node fitzdesk-monitor/instagramImageGenerator.js --slug "${SLUG}"
          fi

      - name: Subir carrusel generado a main
        id: subir_imagenes
        if: steps.check.outputs.status == 'ready' && steps.process.outcome == 'success' && success()
        run: |
          git config user.name  "FitzDesk Bot"
          git config user.email "bot@fitzdesk.com"
          git add public/images/redes/
          if git diff --cached --quiet; then
            echo "Sin imágenes nuevas que subir (ya existían)"
            echo "subidas=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: generar carrusel de Instagram para ${{ steps.check.outputs.published_slug }}"
            git push origin main
            echo "subidas=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Disparar deploy y esperar a que termine
        if: steps.check.outputs.status == 'ready' && steps.process.outcome == 'success' && success() && steps.subir_imagenes.outputs.subidas == 'true'
        timeout-minutes: 5
        # continue-on-error para que un fallo del deploy (o un exit-code inesperado
        # de gh run watch --exit-status) no mate todo el workflow ni bloquee la
        # comprobación de imágenes del paso siguiente. Si el deploy falló de verdad,
        # las imágenes no estarán disponibles y el paso "Esperar imágenes" lo detecta
        # y avisa a Discord por su propia ruta. Si el deploy simplemente tardó en
        # registrarse y gh run watch devolvió un código no-cero por un error de red
        # transitorio, las imágenes pueden ya estar vivas y el carrusel se publica sin
        # problema. En ambos casos el usuario recibe un aviso Discord concreto.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ANTES=$(gh run list --workflow=deploy.yml --limit 1 --json databaseId --jq '.[0].databaseId')
          gh workflow run deploy.yml --ref main
          echo "Esperando a que empiece el nuevo run de deploy.yml..."
          for i in $(seq 1 30); do
            NUEVO=$(gh run list --workflow=deploy.yml --limit 1 --json databaseId --jq '.[0].databaseId')
            if [ "$NUEVO" != "$ANTES" ]; then break; fi
            sleep 5
          done
          echo "Esperando a que termine el run $NUEVO..."
          gh run watch "$NUEVO" --exit-status

      - name: Esperar a que las imágenes estén servidas en vivo
        id: esperar_imagenes
        if: steps.check.outputs.status == 'ready' && steps.process.outcome == 'success' && success()
        timeout-minutes: 6
        continue-on-error: true
        run: |
          SLUG="${{ steps.check.outputs.published_slug }}"
          # Bug crítico corregido el 2026-06-25: este bucle asumía siempre 4
          # slides (1 2 3 4), pero el carrusel de una oferta solo genera 3
          # (instagramImageGenerator.js, generateOfertaCarousel). Con 4
          # hardcodeado, el slide 4 (inexistente) nunca llegaba a 200 y el
          # paso fallaba siempre por timeout para CUALQUIER oferta — el
          # caso de uso central del modo PCDays. Se cuenta el número real
          # de slides ya generados y comiteados en el paso anterior.
          SLIDE_COUNT=$(ls "public/images/redes/${SLUG}-instagram-"*.png 2>/dev/null | wc -l)
          if [ "$SLIDE_COUNT" -eq 0 ]; then
            echo "❌ No se encontró ningún slide generado para $SLUG"
            exit 1
          fi
          echo "Carrusel de $SLIDE_COUNT slide(s) detectado para $SLUG"
          # Espera inicial de 30 s antes de empezar a sondear: el deploy puede
          # tardar en propagar al CDN aunque el workflow de deploy.yml ya haya
          # terminado. Sin este sleep, los primeros intentos fallan garantizados.
          sleep 30
          ELAPSED=30
          MAX_WAIT=300
          while true; do
            ALL_OK=true
            for n in $(seq 1 "$SLIDE_COUNT"); do
              URL="https://fitzdesk.com/images/redes/${SLUG}-instagram-${n}.png"
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
              if [ "$STATUS" != "200" ]; then ALL_OK=false; fi
            done
            if [ "$ALL_OK" = "true" ]; then
              echo "✅ Las $SLIDE_COUNT imágenes del carrusel ya están disponibles en producción"
              break
            fi
            if [ "$ELAPSED" -ge "$MAX_WAIT" ]; then
              echo "❌ Las imágenes no estuvieron disponibles en $MAX_WAIT s tras el deploy"
              exit 1
            fi
            echo "⏳ Aún no disponibles, esperando... ($ELAPSED/$MAX_WAIT s)"
            sleep 10
            ELAPSED=$((ELAPSED + 10))
          done

      # ── 6e-alt. Discord cuando las imágenes no se propagan a tiempo ──────────
      # El paso anterior usa continue-on-error para que el workflow no muera,
      # pero hay que avisar al usuario para que ejecute publicar-en-redes.yml
      # manualmente después de que el CDN haya terminado de propagar.
      - name: Discord — imágenes no disponibles (publicar redes manualmente)
        if: steps.esperar_imagenes.outcome == 'failure'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          jq -n \
            --arg slug "${{ steps.check.outputs.published_slug }}" \
            '{
              embeds: [{
                title: "⚠️ Carrusel no disponible — publicar redes manualmente",
                description: "El artículo se publicó correctamente en la web pero las imágenes del carrusel no estuvieron disponibles en 5 min tras el deploy (CDN lento). Ejecuta **Publicar en redes sociales (manual)** con el slug para publicar en Instagram cuando las imágenes estén servidas.",
                color: 16776960,
                fields: [{ name: "Slug", value: $slug }]
              }]
            }' \
          | curl -s -X POST "$DISCORD_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              --data-binary @-

      # ── 6e. Publicar en redes sociales (Instagram + Facebook) ────────────────
      # Pinterest está preparado en socialPublisher.js pero desactivado
      # (PINTEREST_ENABLED = false) hasta que se den de alta esos secrets.
      - name: Publicar en redes sociales
        if: steps.check.outputs.status == 'ready' && steps.process.outcome == 'success' && steps.esperar_imagenes.outcome == 'success'
        timeout-minutes: 2
        env:
          INSTAGRAM_ACCESS_TOKEN:     ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID:       ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_APP_ID:           ${{ secrets.INSTAGRAM_APP_ID }}
          INSTAGRAM_APP_SECRET:       ${{ secrets.INSTAGRAM_APP_SECRET }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID:           ${{ secrets.FACEBOOK_PAGE_ID }}
          PINTEREST_ACCESS_TOKEN:     ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID:         ${{ secrets.PINTEREST_BOARD_ID }}
          DISCORD_WEBHOOK_URL:        ${{ secrets.DISCORD_WEBHOOK_URL }}
          GROQ_API_KEY:               ${{ secrets.GROQ_API_KEY }}
        run: node fitzdesk-monitor/socialPublisher.js --slug ${{ steps.check.outputs.published_slug }}

      # ── 7. Notificación Discord — error (imagen faltante, frontmatter roto…) ──
      - name: Discord — error de publicación
        if: steps.check.outputs.status == 'ready' && steps.process.outcome == 'failure'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DRAFT_SLUG: ${{ steps.check.outputs.draft_slug }}
          ERROR_MSG:  ${{ steps.process.outputs.error_msg }}
        run: |
          jq -n \
            --arg slug "$DRAFT_SLUG" \
            --arg msg  "$ERROR_MSG" \
            '{
              content: "⚠️ Publicación automática fallida",
              embeds: [{
                title: ("No se pudo publicar " + $slug),
                color: 15548997,
                fields: [
                  { name: "Motivo",           value: $msg },
                  { name: "Acción requerida", value: "Revisa el borrador y publica manualmente" }
                ]
              }]
            }' \
          | curl -s -X POST "$DISCORD_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              --data-binary @- \
          && echo "Notificación Discord enviada" \
          || echo "⚠️ No se pudo enviar la notificación Discord"

      # ── 8. Notificación Discord — fallo inesperado del workflow ─────────────────
      # Catch-all que cubre fallos en cualquier paso anterior no gestionado por
      # las notificaciones específicas (proceso fallido, imágenes no disponibles).
      # Incluye fallos tempranos (checkout, git, Actions runner, etc.) que de otro
      # modo pasarían completamente desapercibidos.
      - name: Discord — fallo inesperado del workflow
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          SLUG="${{ steps.check.outputs.published_slug }}"
          DRAFT="${{ steps.check.outputs.draft_slug }}"
          LABEL="${SLUG:-${DRAFT:-desconocido}}"
          jq -n \
            --arg label "$LABEL" \
            '{
              embeds: [{
                title: "🔴 Workflow de publicación fallido inesperadamente",
                description: "El workflow terminó con error sin llegar a notificarlo por el canal habitual. Revisa los logs de GitHub Actions y publica manualmente si el artículo no aparece en la web.",
                color: 15548997,
                fields: [
                  { name: "Artículo / Borrador", value: $label },
                  { name: "Acción",              value: "GitHub → Actions → Publicar automático FitzDesk → ver logs del run fallido" }
                ]
              }]
            }' \
          | curl -s -X POST "$DISCORD_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              --data-binary @- \
          && echo "Notificación de fallo inesperado enviada" \
          || echo "⚠️ No se pudo enviar la notificación Discord"
