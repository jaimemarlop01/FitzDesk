name: Publicar automático FitzDesk

# Domingo, martes y jueves. Objetivo: publicar dentro de la ventana 9:00-14:00 hora España.
# Programado a las 5:35 UTC (7:35 CEST / 6:35 CET) — minuto descuadrado para evitar la
# congestión del minuto en punto. Aun así, los eventos "schedule" de GitHub Actions reciben
# prioridad de cola más baja que push/workflow_dispatch, y el retraso real observado es
# variable e impredecible (de horas a 2-3 días, ver CLAUDE.md 2026-06-23). auto-publisher.js
# solo compara la fecha, no la hora, así que la publicación ocurre igual aunque se ejecute
# tarde. La ventana 9:00-14:00 es una expectativa realista, no una garantía.
on:
  schedule:
    - cron: '35 5 * * 0,2,4'
  workflow_dispatch:
    inputs:
      fecha_override:
        description: 'Simular una fecha concreta (YYYY-MM-DD). Vacío = hoy en Madrid.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout de main con acceso completo al historial ─────────────────
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Node.js para ejecutar auto-publisher.js ───────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── 2b. Sincronizar el calendario desde develop ──────────────────────────
      # develop es la fuente real de verdad del calendario (ahí se edita siempre).
      # Sin este paso, main puede quedarse con una copia vieja del calendario y
      # el --check de abajo dejaría de encontrar entradas futuras en silencio
      # (bug detectado el 2026-06-23, ver CLAUDE.md). Se sobrescribe el archivo
      # local SIEMPRE antes de leerlo, y si difiere de lo que hay en main se
      # sube también, para que main no vuelva a quedarse desfasado.
      - name: Sincronizar calendario desde develop
        run: |
          git fetch origin develop
          git show origin/develop:fitzdesk-monitor/data/calendario-publicaciones.json \
            > fitzdesk-monitor/data/calendario-publicaciones.json

          if git diff --quiet -- fitzdesk-monitor/data/calendario-publicaciones.json; then
            echo "Calendario de main ya estaba al día"
          else
            git config user.name  "FitzDesk Bot"
            git config user.email "bot@fitzdesk.com"
            git add fitzdesk-monitor/data/calendario-publicaciones.json
            git commit -m "chore: sincronizar calendario de publicaciones desde develop"
            git push origin main
            echo "Calendario de main sincronizado con develop"
          fi

      # ── 3. Leer calendario y decidir qué publicar ────────────────────────────
      - name: Comprobar calendario
        id: check
        env:
          FECHA_OVERRIDE: ${{ inputs.fecha_override }}
        run: node fitzdesk-monitor/auto-publisher.js --check

      # ── 4. Traer borrador e imagen desde la rama develop ─────────────────────
      - name: Obtener borrador e imagen desde develop
        if: steps.check.outputs.status == 'ready'
        run: |
          git fetch origin develop

          DRAFT_FILE="src/content/articulos/${{ steps.check.outputs.draft_slug }}.md"
          IMAGE_FILE="public/images/articulos/${{ steps.check.outputs.image_filename }}"

          # El borrador siempre debe estar en develop
          git checkout origin/develop -- "$DRAFT_FILE"
          echo "Borrador obtenido: $DRAFT_FILE"

          # La imagen puede no existir si imageCollector no se ejecutó aún
          if git cat-file -e "origin/develop:${IMAGE_FILE}" 2>/dev/null; then
            git checkout origin/develop -- "$IMAGE_FILE"
            echo "Imagen obtenida: $IMAGE_FILE"
          else
            echo "⚠️  Imagen no encontrada en develop: $IMAGE_FILE"
            echo "    El paso --process detectará esto y enviará notificación a Discord"
          fi

      # ── 5. Editar frontmatter y renombrar el archivo ─────────────────────────
      - name: Procesar borrador
        id: process
        if: steps.check.outputs.status == 'ready'
        continue-on-error: true
        env:
          DRAFT_SLUG:     ${{ steps.check.outputs.draft_slug }}
          PUBLISHED_SLUG: ${{ steps.check.outputs.published_slug }}
        run: node fitzdesk-monitor/auto-publisher.js --process

      # ── 6. Commit y push a main (dispara deploy.yml automáticamente) ─────────
      - name: Publicar en main
        if: steps.check.outputs.status == 'ready' && steps.process.outcome == 'success'
        run: |
          git config user.name  "FitzDesk Bot"
          git config user.email "bot@fitzdesk.com"

          PUB_FILE="src/content/articulos/${{ steps.check.outputs.published_slug }}.md"
          DRF_FILE="src/content/articulos/${{ steps.check.outputs.draft_slug }}.md"
          IMG_FILE="public/images/articulos/${{ steps.check.outputs.image_filename }}"

          git add "$PUB_FILE"

          # Si se renombró el archivo, quitar el draft del índice git
          if [ "${{ steps.check.outputs.draft_slug }}" != "${{ steps.check.outputs.published_slug }}" ]; then
            git rm --cached "$DRF_FILE" 2>/dev/null || true
          fi

          [ -f "$IMG_FILE" ] && git add "$IMG_FILE"

          git commit -m "feat: publicar ${{ steps.check.outputs.titulo }}"
          git push origin main

      # ── 6b. Sincronizar develop con la versión ya publicada ──────────────────
      # Sin este paso, develop se queda para siempre con el borrador antiguo
      # (borrador: true, nombre con prefijo borrador-) aunque ya esté publicado
      # en main — invisible en local (npm run dev/build sobre develop filtra los
      # artículos con borrador: true) y desincronizado del estado real del sitio.
      - name: Sincronizar develop con el artículo publicado
        if: steps.check.outputs.status == 'ready' && steps.process.outcome == 'success'
        run: |
          PUB_FILE="src/content/articulos/${{ steps.check.outputs.published_slug }}.md"
          DRF_FILE="src/content/articulos/${{ steps.check.outputs.draft_slug }}.md"
          IMG_FILE="public/images/articulos/${{ steps.check.outputs.image_filename }}"

          # Guardar el contenido ya publicado (sin borrador: true) antes de cambiar de rama
          cp "$PUB_FILE" /tmp/published_article.md
          [ -f "$IMG_FILE" ] && cp "$IMG_FILE" /tmp/published_image || true

          git fetch origin develop
          git checkout -B develop origin/develop

          # Sustituir el borrador antiguo por la versión publicada
          if [ "${{ steps.check.outputs.draft_slug }}" != "${{ steps.check.outputs.published_slug }}" ]; then
            git rm --ignore-unmatch "$DRF_FILE"
          fi
          cp /tmp/published_article.md "$PUB_FILE"
          git add "$PUB_FILE"
          if [ -f /tmp/published_image ]; then
            cp /tmp/published_image "$IMG_FILE"
            git add "$IMG_FILE"
          fi

          if git diff --cached --quiet; then
            echo "develop ya estaba al día — nada que sincronizar"
          else
            git commit -m "chore: sincronizar ${{ steps.check.outputs.titulo }} publicado en main"
            git push origin develop
          fi

      # ── 6c. Instalar dependencias del monitor para redes sociales ────────────
      # socialPublisher.js usa dotenv y gray-matter, que no son built-ins de
      # Node. El checkout no incluye node_modules (gitignored) y este paso
      # nunca existía — el step de abajo fallaba siempre con
      # ERR_MODULE_NOT_FOUND, independientemente de los secrets (bug
      # detectado y corregido el 2026-06-23, reproducido localmente
      # simulando un checkout limpio de CI).
      - name: Instalar dependencias del monitor
        if: steps.check.outputs.status == 'ready' && steps.process.outcome == 'success' && success()
        working-directory: fitzdesk-monitor
        run: npm ci --omit=dev

      # ── 6d. Publicar en redes sociales (Instagram + Facebook) ────────────────
      # Pinterest está preparado en socialPublisher.js pero desactivado
      # (PINTEREST_ENABLED = false) hasta que se den de alta esos secrets.
      - name: Publicar en redes sociales
        if: steps.check.outputs.status == 'ready' && steps.process.outcome == 'success' && success()
        timeout-minutes: 2
        env:
          INSTAGRAM_ACCESS_TOKEN:     ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID:       ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_APP_ID:           ${{ secrets.INSTAGRAM_APP_ID }}
          INSTAGRAM_APP_SECRET:       ${{ secrets.INSTAGRAM_APP_SECRET }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID:           ${{ secrets.FACEBOOK_PAGE_ID }}
          PINTEREST_ACCESS_TOKEN:     ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID:         ${{ secrets.PINTEREST_BOARD_ID }}
          DISCORD_WEBHOOK_URL:        ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node fitzdesk-monitor/socialPublisher.js --slug ${{ steps.check.outputs.published_slug }}

      # ── 7. Notificación Discord — éxito ──────────────────────────────────────
      - name: Discord — publicación exitosa
        if: steps.check.outputs.status == 'ready' && steps.process.outcome == 'success'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          jq -n \
            --arg titulo "${{ steps.check.outputs.titulo }}" \
            --arg slug   "${{ steps.check.outputs.published_slug }}" \
            --arg fecha  "${{ steps.check.outputs.fecha }}" \
            '{
              embeds: [{
                title:       "✅ Publicado automáticamente",
                description: ("**" + $titulo + "**"),
                color:       5763719,
                fields: [
                  { name: "Slug",  value: $slug,  inline: true },
                  { name: "Fecha", value: $fecha, inline: true }
                ]
              }]
            }' \
          | curl -s -X POST "$DISCORD_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              --data-binary @-

      # ── 8. Notificación Discord — error (imagen faltante, frontmatter roto…) ──
      - name: Discord — error de publicación
        if: steps.check.outputs.status == 'ready' && steps.process.outcome == 'failure'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          jq -n \
            --arg slug "${{ steps.check.outputs.draft_slug }}" \
            --arg msg  "${{ steps.process.outputs.error_msg }}" \
            '{
              content: "⚠️ Publicación automática fallida",
              embeds: [{
                title: ("No se pudo publicar " + $slug),
                color: 15548997,
                fields: [
                  { name: "Motivo",           value: $msg },
                  { name: "Acción requerida", value: "Revisa el borrador y publica manualmente" }
                ]
              }]
            }' \
          | curl -s -X POST "$DISCORD_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              --data-binary @-
