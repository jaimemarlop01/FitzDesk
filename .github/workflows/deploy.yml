name: Deploy FitzDesk to GitHub Pages

# Los pushes a main hechos con el GITHUB_TOKEN automático de otro workflow
# (p. ej. publicar-automatico.yml) NO disparan el evento "push" de este
# workflow — es una restricción de seguridad de GitHub Actions contra bucles
# infinitos. Por eso se añade workflow_run: así, cuando publicar-automatico
# termina (publique algo o no), este deploy se dispara igualmente.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Publicar automático FitzDesk"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: npm install

      - name: Build Astro
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
