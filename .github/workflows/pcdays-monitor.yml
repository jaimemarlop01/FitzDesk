name: FitzDesk Monitor — Modo PCDays

# Modo especial para los PCDays de PcComponentes (TAREA 6, CLAUDE.md): se
# comprueba cada 2 horas en vez de una vez al día, con umbral de publicación
# automática más bajo (15% en vez de 20%) y más publicaciones permitidas al
# día (8 en vez de 5). Pensado para detectar y publicar ofertas sin
# intervención manual mientras dure el evento.
#
# Interruptor remoto: el cron de este workflow está SIEMPRE activo, pero
# cada ejecución comprueba primero la variable de repositorio PCDAYS_MODE
# (Settings → Secrets and variables → Actions → Variables — se puede leer y
# cambiar desde el navegador, incluido el móvil, sin necesitar terminal ni
# `gh` CLI). Si no vale exactamente "true", el job termina inmediatamente
# sin hacer nada. Así se puede activar/desactivar el modo PCDays a
# distancia sin tocar código ni hacer un commit.
on:
  schedule:
    - cron: '17 */2 * * *'  # cada 2 horas, minuto descuadrado para evitar congestión
  workflow_dispatch:        # para activar/probar manualmente sin esperar al cron

permissions:
  contents: write  # escribir borradores/caché vía API y publicar directamente en main
  actions: write   # disparar deploy.yml y publicar-en-redes.yml tras publicar una oferta

jobs:
  pcdays-check:
    runs-on: ubuntu-latest
    if: vars.PCDAYS_MODE == 'true'

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: fitzdesk-monitor/package-lock.json

      - name: Instalar dependencias
        run: |
          cd fitzdesk-monitor
          npm install

      - name: Ejecutar monitor en modo PCDays
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
          ASTRO_CONTENT_PATH: ${{ github.workspace }}/src/content/articulos
        run: |
          cd fitzdesk-monitor
          node monitor.js --pcdays

  # Job informativo: si PCDAYS_MODE no está activo, este job se ejecuta en
  # su lugar y no hace nada salvo dejar constancia en el log de por qué —
  # evita que cada ejecución del cron aparezca como "skipped" sin contexto.
  pcdays-inactive:
    runs-on: ubuntu-latest
    if: vars.PCDAYS_MODE != 'true'
    steps:
      - name: Modo PCDays desactivado
        run: echo "PCDAYS_MODE no está a 'true' (Settings → Variables) — no se ejecuta nada."
