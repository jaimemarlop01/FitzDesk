name: Publicar en redes sociales (manual)

# Workflow independiente para publicar o republicar un artículo ya existente
# en Instagram/Facebook/Pinterest sin pasar por publicar-automatico.yml. Ese
# pipeline asume que el artículo todavía es un borrador pendiente y falla en
# el paso "Obtener borrador e imagen desde develop" si el artículo ya fue
# publicado y renombrado (bug detectado el 2026-06-23) — este workflow no
# toca el calendario ni el contenido, solo ejecuta socialPublisher.js.
#
# El carrusel de Instagram se genera bajo demanda en el propio runner, pero
# Meta necesita descargarlo desde una URL pública real (https://fitzdesk.com/
# images/redes/...) — si esas imágenes nunca se suben al repo ni se
# despliegan, Instagram falla con "Only photo or video can be accepted as
# media type" porque la URL da 404 (bug detectado el 2026-06-25). Por eso
# este workflow ahora: genera el carrusel, lo comitea a main, dispara
# deploy.yml explícitamente (el push con GITHUB_TOKEN no lo dispara solo —
# misma restricción ya documentada para publicar-automatico.yml) y espera a
# que el deploy termine y la imagen esté servida en vivo antes de llamar a
# la API de Meta.

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Slug del artículo ya publicado (sin prefijo borrador-)'
        required: true
      only:
        description: 'Publicar solo en una red (instagram o facebook). Vacío = ambas. Útil para reintentar una sin duplicar la otra.'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

jobs:
  publicar-redes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: fitzdesk-monitor/package-lock.json

      - name: Instalar dependencias del monitor
        working-directory: fitzdesk-monitor
        run: npm ci --omit=dev

      # ── Generar el carrusel de Instagram y publicarlo en producción ANTES
      #    de llamar a la API de Meta (necesita la URL pública real) ────────
      - name: Generar carrusel de Instagram
        if: inputs.only != 'facebook'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node fitzdesk-monitor/instagramImageGenerator.js --slug ${{ inputs.slug }}

      - name: Subir carrusel generado a main
        id: subir_imagenes
        if: inputs.only != 'facebook'
        run: |
          git config user.name  "FitzDesk Bot"
          git config user.email "bot@fitzdesk.com"
          git add public/images/redes/
          if git diff --cached --quiet; then
            echo "Sin imágenes nuevas que subir (ya existían)"
            echo "subidas=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: generar carrusel de Instagram para ${{ inputs.slug }}"
            git push origin main
            echo "subidas=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Disparar deploy y esperar a que termine
        if: inputs.only != 'facebook' && steps.subir_imagenes.outputs.subidas == 'true'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ANTES=$(gh run list --workflow=deploy.yml --limit 1 --json databaseId --jq '.[0].databaseId')
          gh workflow run deploy.yml --ref main
          echo "Esperando a que empiece el nuevo run de deploy.yml..."
          for i in $(seq 1 30); do
            NUEVO=$(gh run list --workflow=deploy.yml --limit 1 --json databaseId --jq '.[0].databaseId')
            if [ "$NUEVO" != "$ANTES" ]; then break; fi
            sleep 5
          done
          echo "Esperando a que termine el run $NUEVO..."
          gh run watch "$NUEVO" --exit-status

      - name: Esperar a que las imágenes estén servidas en vivo
        id: esperar_imagenes
        if: inputs.only != 'facebook'
        timeout-minutes: 6
        continue-on-error: true
        run: |
          SLUG="${{ inputs.slug }}"
          # Bug crítico corregido el 2026-06-25: este bucle asumía siempre 4
          # slides (1 2 3 4), pero el carrusel de una oferta solo genera 3
          # (instagramImageGenerator.js, generateOfertaCarousel). Con 4
          # hardcodeado, el slide 4 (inexistente) nunca llegaba a 200 y el
          # paso fallaba siempre por timeout para CUALQUIER oferta — el
          # caso de uso central del modo PCDays. Se cuenta el número real
          # de slides ya generados y comiteados en el paso anterior.
          SLIDE_COUNT=$(ls "public/images/redes/${SLUG}-instagram-"*.png 2>/dev/null | wc -l)
          if [ "$SLIDE_COUNT" -eq 0 ]; then
            echo "❌ No se encontró ningún slide generado para $SLUG"
            exit 1
          fi
          echo "Carrusel de $SLIDE_COUNT slide(s) detectado para $SLUG"
          # Espera inicial de 30 s antes de empezar a sondear: el deploy puede
          # tardar en propagar al CDN aunque el workflow de deploy.yml ya haya
          # terminado. Sin este sleep, los primeros intentos fallan garantizados.
          sleep 30
          ELAPSED=30
          MAX_WAIT=300
          while true; do
            ALL_OK=true
            for n in $(seq 1 "$SLIDE_COUNT"); do
              URL="https://fitzdesk.com/images/redes/${SLUG}-instagram-${n}.png"
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
              if [ "$STATUS" != "200" ]; then ALL_OK=false; fi
            done
            if [ "$ALL_OK" = "true" ]; then
              echo "✅ Las $SLIDE_COUNT imágenes del carrusel ya están disponibles en producción"
              break
            fi
            if [ "$ELAPSED" -ge "$MAX_WAIT" ]; then
              echo "❌ Las imágenes no estuvieron disponibles en $MAX_WAIT s tras el deploy"
              exit 1
            fi
            echo "⏳ Aún no disponibles, esperando... ($ELAPSED/$MAX_WAIT s)"
            sleep 10
            ELAPSED=$((ELAPSED + 10))
          done

      - name: Publicar en redes sociales
        if: inputs.only == 'facebook' || steps.esperar_imagenes.outcome == 'success'
        timeout-minutes: 2
        env:
          INSTAGRAM_ACCESS_TOKEN:     ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID:       ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_APP_ID:           ${{ secrets.INSTAGRAM_APP_ID }}
          INSTAGRAM_APP_SECRET:       ${{ secrets.INSTAGRAM_APP_SECRET }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID:           ${{ secrets.FACEBOOK_PAGE_ID }}
          PINTEREST_ACCESS_TOKEN:     ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID:         ${{ secrets.PINTEREST_BOARD_ID }}
          DISCORD_WEBHOOK_URL:        ${{ secrets.DISCORD_WEBHOOK_URL }}
          GROQ_API_KEY:               ${{ secrets.GROQ_API_KEY }}
        run: |
          ARGS="--slug ${{ inputs.slug }}"
          if [ -n "${{ inputs.only }}" ]; then
            ARGS="$ARGS --only ${{ inputs.only }}"
          fi
          node fitzdesk-monitor/socialPublisher.js $ARGS
