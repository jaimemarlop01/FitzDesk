      <rect x="44" y="-65" width="30" height="30" rx="4"/>
      <rect x="82" y="-65" width="30" height="30" rx="4"/>
      <rect x="120" y="-65" width="30" height="30" rx="4"/>
      <rect x="158" y="-65" width="30" height="30" rx="4"/>
