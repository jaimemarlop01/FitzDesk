      <rect x="-168" y="-27" width="30" height="30" rx="4"/>
      <rect x="-130" y="-27" width="30" height="30" rx="4"/>
      <rect x="-92" y="-27" width="30" height="30" rx="4"/>
      <rect x="-54" y="-27" width="30" height="30" rx="4"/>
      <rect x="-16" y="-27" width="30" height="30" rx="4"/>
      <rect x="22" y="-27" width="30" height="30" rx="4"/>
      <rect x="60" y="-27" width="30" height="30" rx="4"/>
      <rect x="98" y="-27" width="30" height="30" rx="4"/>
      <rect x="136" y="-27" width="30" height="30" rx="4"/>
      <rect x="174" y="-27" width="84" height="30" rx="4"/>
